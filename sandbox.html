	<body>
		<div>
		<form id="HTMLCodeSandbox", onSubmit="updateCode(); return false;">
			<label for="html">Script:</label><br>
			<textarea rows="30" cols="60" type="text" id="codeHTML" name="codeHTML"></textarea><br><br>
			<button type="submit">Reload Code</button>
		</form>
		</div>
		<iframe id="preview" title="Inline Frame Example" width="600" height="600"></iframe>
	

	<script>
			document.getElementById("HTMLCodeSandbox").
				addEventListener("submit", updateCode)
	
			function updateCode() {
				let code = document.getElementById("codeHTML").value;
				//localStorage.setItem("HTMLCode", code); Hidden for now 
				document.getElementById("preview").innerHTML = code; 
				
			}
	</script>
