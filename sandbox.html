<html>
	<head>
		<!-- Title -->

		<!-- Styles Link -->

		<!-- Datatype Font -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Datatype&display=swap" rel="stylesheet">

	<nav class='fadein'>
		<a href="index.html">Landing Page</a>
		
		<a href="sandbox.html">DevQuest HTML Sandbox</a>
		
		<a href="accounts.html">Create Guest Account</a>
		
		<a id="GuestName" value=""></a>
		
		<script src="setGuestUsername.js"></script> 
	</nav>
	
	<body>
		<div>
		<form id="HTMLCodeSandbox", onSubmit="updateCode();">
			<label>Script:</label><br>
			<textarea rows="30" cols="60" type="text" id="codeHTML" name="codeHTML"></textarea><br><br>
			<button type="submit">Reload Code</button>
		</form>
		</div>
		<iframe id="previewFrame" class="websitePreview" src="userWebsitePreview.html" title="Code Output" width="600" height="600">
			<!--<div id="preview"></div>-->
		</iframe>
		<br>
		<button><a style="color:black" href="userWebsitePreview.html" target="_blank">Open In New Tab</button>

	<script>
			if (localStorage.getItem("HTMLCode")) {	
				document.getElementById("codeHTML").value = localStorage.getItem("HTMLCode"); 
			}
		
			document.getElementById("HTMLCodeSandbox").
				addEventListener("submit", updateCode)
	
			function updateCode() {
				let code = document.getElementById("codeHTML").value;
				localStorage.setItem("HTMLCode", code);
			}
	</script>

	</body>
